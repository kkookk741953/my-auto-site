name: AI Daily Auto Post Pipeline

on:
  schedule:
    - cron: '0 */8 * * *' # 8시간마다 하루 3번 자동 실행 (글 고속 축적)
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Auto Post Script
        run: |
          python -c "
          import datetime
          import random

          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          
          # 다양한 고단가 카테고리 주제 DB
          posts_db = [
              {
                  'title': '2026년 구글 애드센스 승인 빠르게 받는 핵심 노하우 5가지',
                  'sub1': '1. 카테고리 단일화와 주제의 명확성',
                  'desc1': '잡블로그 형태보다는 하나의 전문 분야(IT, 금융, 건강 등)에 집중된 글을 올리는 것이 구글 AI의 평가 점수를 대폭 높여줍니다.',
                  'sub2': '2. 최소 1,000자 이상의 텍스트 분량 확보',
                  'desc2': '이미지 위주의 포스팅보다 두괄식 문장과 소제목이 정리된 1,000자 이상의 알찬 긴 글이 애드센스 승인 기준에 부합합니다.',
                  'sub3': '3. 가독성을 높이는 HTML 태그 구조화',
                  'desc3': 'h2, h3 소제목 태그와 blockquote(인용구)를 활용해 방문자가 오래 머무를 수 있는 깔끔한 UI 레이아웃을 제공해야 합니다.',
                  'sub4': '4. 모바일 반응형 웹사이트 환경',
                  'desc4': '전체 방문자의 70% 이상이 모바일 사용자이므로, 모바일 디스플레이에 최적화된 테마 형태를 유지하는 것이 필수적입니다.',
                  'sub5': '5. 검색엔진 크롤링을 위한 사이트맵 제출',
                  'desc5': '구글 서치콘솔에 내 웹사이트의 URL을 정기적으로 알려주어 검색 로봇이 최신 글을 빠르게 퍼가도록 설정합니다.'
              },
              {
                  'title': '초보자도 성공하는 AI 활용 무자본 자동 수익 파이프라인',
                  'sub1': '1. 서버 비용 0원으로 호스팅 세팅하기',
                  'desc1': 'GitHub Pages 서비스로 평생 월 서버 비용 없이 안정적인 고성능 웹 호스팅 환경을 구축할 수 있습니다.',
                  'sub2': '2. CI/CD 자동화 스크립트로 무인 운영하기',
                  'desc2': 'GitHub Actions 스크립트를 활용해 지정된 시간마다 자동으로 글이 작성되고 배포되는 무인 시스템을 가동합니다.',
                  'sub3': '3. 검색 트렌드 키워드 자동 발굴 전략',
                  'desc3': '사람들이 실제로 검색하는 고단가 키워드를 선정하여 지속적인 자연 유입 트래픽을 유도합니다.',
                  'sub4': '4. 애드센스 광고 배치 및 클릭률 최적화',
                  'desc4': '본문 상단, 중간, 하단 등 방문자의 시선이 가장 많이 머무는 위치에 디스플레이 광고를 효과적으로 배치합니다.',
                  'sub5': '5. 수익 다각화(제휴 마케팅 연동)',
                  'desc5': '애드센스 광고 수익 외에도 관련 정보 링크를 통한 제휴 마케팅 커미션 수입을 병행하여 수익을 극대화합니다.'
              },
              {
                  'title': '검색 상위 노출을 만드는 SEO 키워드 분석 및 배치 전략',
                  'sub1': '1. 메인 키워드와 서브 키워드의 조합',
                  'desc1': '경쟁이 너무 치열한 롱테일 키워드보다는 검색량은 적당하고 경쟁 강도가 낮은 틈새 키워드를 타깃팅합니다.',
                  'sub2': '2. 본문 상단 첫 문장의 중요성',
                  'desc2': '글이 시작하는 첫 2~3줄 안에 검색 키워드를 자연스럽게 포함시켜 검색 로봇이 주제를 명확히 파악하게 합니다.',
                  'sub3': '3. 체류 시간을 늘리는 고품질 콘텐츠 구성',
                  'desc3': '방문자가 사이트에 들어온 즉시 이탈하지 않고 오래 읽도록 핵심 정보와 요약 박스를 강조해 배치합니다.',
                  'sub4': '4. 사이트 내부 링크를 통한 연관 글 유도',
                  'desc4': '관련된 이전 포스팅으로 연결되는 링크를 자연스럽게 제공해 페이지뷰(PV) 수를 지속적으로 증가시킵니다.',
                  'sub5': '5. 검색 로봇 피드백(IndexNow) 활용',
                  'desc5': '글이 올라오는 즉시 검색엔진 로봇에 자동 신호를 전달하여 1분 이내로 검색 결과에 반영되도록 최적화합니다.'
              }
          ]
          
          item = random.choice(posts_db)
          
          new_post = f'''
          <article class=\"post\">
              <h2>🚀 {item['title']}</h2>
              <p style=\"color: #666; font-size: 0.9em;\">발행일시: {now} | 작성자: AI 수익 자동화 파이프라인</p>
              <hr style=\"border: 0; height: 1px; background: #eee; margin: 15px 0;\">
              <p>본 포스팅은 구글 검색엔진 최적화(SEO) 기준에 따라 자동으로 분석되어 발행된 프리미엄 정보 리포트입니다.</p>
              
              <h3>{item['sub1']}</h3>
              <p>{item['desc1']}</p>
              
              <h3>{item['sub2']}</h3>
              <p>{item['desc2']}</p>
              
              <h3>{item['sub3']}</h3>
              <p>{item['desc3']}</p>

              <h3>{item['sub4']}</h3>
              <p>{item['desc4']}</p>

              <h3>{item['sub5']}</h3>
              <p>{item['desc5']}</p>
              
              <blockquote style=\"background: #f8f9fa; border-left: 4px solid #28a745; padding: 12px; margin: 20px 0; border-radius: 4px;\">
                  <b>💡 핵심 요약:</b> 자동화 수익 파이프라인의 성패는 꾸준한 콘텐츠 축적과 검색엔진 수집 노출에 달려 있습니다.
              </blockquote>
          </article>
          '''
          
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          updated_content = content.replace('<div class=\"content\">', '<div class=\"content\">\n' + new_post)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Auto-Bot"
          git config --global user.email "bot@auto.com"
          git add index.html
          git commit -m "Auto: Publish SEO rich article" || exit 0
          git push
