name: AI Daily Auto Post Pipeline

on:
  schedule:
    - cron: '0 */8 * * *' # 8시간마다 자동 실행
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Auto Post Script
        run: |
          python -c "
          import datetime
          import random

          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          
          posts_db = [
              {
                  'title': '일상 업무 효율을 10배 높여주는 무료 AI 툴 추천 Top 5',
                  'sub1': '1. 자동 문서 요약 및 글쓰기 지원 AI', 'desc1': '긴 보고서나 기사를 한눈에 요약해주고, 복잡한 메일 작성을 몇 초 만에 도와주는 AI 툴 활용법입니다.',
                  'sub2': '2. 고화질 이미지 및 디자인 생성 AI', 'desc2': '디자인 지식이 없어도 원하는 설명만 입력하면 PPT 발표 자료나 썸네일을 만드는 툴입니다.',
                  'sub3': '3. 음성 파일 텍스트 자동 변환 툴', 'desc3': '회의록이나 강의 녹음 파일의 텍스트 변환 및 핵심 요약을 자동으로 처리합니다.',
                  'sub4': '4. 엑셀 함수 및 데이터 분석 자동화', 'desc4': '어려운 엑셀 수식을 외울 필요 없이 원하는 결과를 말로 입력하면 자동으로 수식을 생성해 줍니다.',
                  'sub5': '5. 나만의 맞춤형 AI 비서 설정 노하우', 'desc5': '스마트폰과 PC에서 매일 반복되는 일정 관리와 메모 정리 업무를 자동화하는 가이드입니다.'
              },
              {
                  'title': '스마트폰 배터리 수명 2배 늘리는 필수 설정 꿀팁',
                  'sub1': '1. 화면 디스플레이 최적화 설정', 'desc1': '다크 모드 활용과 자동 밝기 조절, 주사율 설정을 변경하여 배터리 소모량을 줄입니다.',
                  'sub2': '2. 백그라운드 앱 데이터 차단하기', 'desc2': '사용하지 않는 앱들이 뒤에서 배터리와 데이터를 소모하지 않도록 절전 상태로 전환합니다.',
                  'sub3': '3. 올바른 충전 습관과 방전 방지 팁', 'desc3': '80% 제한 충전 기능 활용법과 배터리 수명을 갉아먹는 과열 현상을 방지합니다.',
                  'sub4': '4. 위치 서비스 및 위치 추적 관리', 'desc4': '불필요한 앱들의 위치 권한을 지정하여 배터리 누수를 차단하세요.',
                  'sub5': '5. 시스템 최적화 및 메모리 정리', 'desc5': '주기적으로 기기를 자동으로 재부팅하고 불필요한 캐시 파일을 정리하는 기능입니다.'
              },
              {
                  'title': '숨은 정부 지원금 한눈에 조회하고 바로 신청하는 방법',
                  'sub1': '1. 보조금24 맞춤형 지원금 검색', 'desc1': '정부24 플랫폼의 보조금24 서비스를 통해 내가 받을 수 있는 지자체 혜택을 한 번에 확인합니다.',
                  'sub2': '2. 연령대별 주요 지원 혜택 정리', 'desc2': '청년도약계좌, 내일배움카드, 구직활동지원금 등 놓치기 쉬운 주요 금융 정책들을 안내합니다.',
                  'sub3': '3. 미환급금 및 휴면예금 찾기', 'desc3': '건강보험료 환급금, 통신사 미환급금, 휴면계좌 숨은 돈을 3분 만에 조회하고 입금받습니다.',
                  'sub4': '4. 카드 포인트 현금화 서비스 활용', 'desc4': '소멸되기 쉬운 여러 카드의 포인트를 하나로 모아 즉시 현금으로 계좌 이체하는 팁입니다.',
                  'sub5': '5. 신청 시 필수 제출 서류 준비', 'desc5': '지원금 신청 기간과 자격 요건을 미리 확인하고 필요한 증빙 서류를 준비하세요.'
              },
              {
                  'title': 'PC 및 노트북 속도 2배 향상시키는 초간단 용량 정리법',
                  'sub1': '1. 임시 파일 및 시스템 캐시 삭제', 'desc1': '윈도우에 쌓이는 불필요한 임시 파일과 브라우저 캐시 데이터를 원클릭으로 정리합니다.',
                  'sub2': '2. 시작 프로그램 및 부팅 최적화', 'desc2': '부팅 시 자동으로 실행되어 속도를 느리게 만드는 비필수 프로그램들의 자동 시작을 차단합니다.',
                  'sub3': '3. 디스크 정리 및 저장 공간 감지', 'desc3': '윈도우 자체 저장 공간 감지 기능을 활성화하여 방치된 대용량 다운로드 파일을 자동 청소합니다.',
                  'sub4': '4. 불필요한 그리드 소프트웨어 삭제', 'desc4': '인터넷 속도를 저하시키는 P2P 관련 그리드 프로그램들을 탐색하여 제거하는 방법입니다.',
                  'sub5': '5. SSD 성능 최적화 및 드라이브 조각 모음', 'desc5': 'SSD 최적화 스케줄링을 통해 파일 읽기/쓰기 속도를 항상 최적의 상태로 유지합니다.'
              },
              {
                  'title': '비행기표 최저가로 예매하는 검색 꿀팁 및 알고리즘 회피법',
                  'sub1': '1. 시크릿 모드로 쿠키 추적 회피하기', 'desc1': '항공권 검색 시 쿠키 기록이 남으면 가격이 올라갈 수 있으므로 시크릿 모드를 활용합니다.',
                  'sub2': '2. 항공권 가격이 가장 저렴한 요일과 시간대', 'desc2': '통계적으로 항공권 가격이 낮게 책정되는 주중 화요일/수요일 예매 팁을 안내합니다.',
                  'sub3': '3. 다구간 항공권 및 경유편 조합 활용', 'desc3': '직항 대비 훨씬 저렴하게 여행할 수 있는 스톱오버 및 다구간 검색 기법입니다.',
                  'sub4': '4. 항공사 땡처리 특가 알림 설정', 'desc4': '항공사별 프로모션 스케줄을 미리 파악하고 얼리버드 알림을 받는 스마트한 설정법입니다.',
                  'sub5': '5. 마일리지 적립 및 제휴 카드 할인 혜택', 'desc5': '일상 소비를 통해 항공 마일리지를 효율적으로 적립하고 환전 우대까지 챙기는 방법입니다.'
              },
              {
                  'title': '자취생 필수! 한 달 식비 30% 줄이는 냉장고 파먹기 노하우',
                  'sub1': '1. 주간 식단표와 장보기 리스트 작성', 'desc1': '충동구매를 막고 꼭 필요한 식재료만 구매하도록 일주일 단위 식단을 기획합니다.',
                  'sub2': '2. 식재료 장기 보관 및 소분 냉동법', 'desc2': '파, 마늘, 고기 등 상하기 쉬운 식재료를 밀폐 용기에 올바르게 소분하여 신선도를 유지합니다.',
                  'sub3': '3. 남은 잔반 활용 레시피와 만능 양념장', 'desc3': '냉장고에 남은 자투리 채소와 재료로 5분 만에 만드는 가성비 요리 꿀팁입니다.',
                  'sub4': '4. 유통기한과 소비기한의 차이점 파악', 'desc4': '버려지는 음식물을 줄이기 위해 유통기한과 실제 섭취 가능한 소비기한을 정확히 구별합니다.',
                  'sub5': '5. 대형마트 타임세일 및 마감 할인 공략', 'desc5': '저녁 시간대 정육, 수산, 조리식품 코너의 마감 할인 스티커를 활용하는 방법입니다.'
              },
              {
                  'title': '유튜브 프리미엄/OTT 구독료 아끼는 계정 공유 및 할인 꿀팁',
                  'sub1': '1. 통신사 결합 요금제 혜택 모아보기', 'desc1': '통신사 요금제에 포함된 무료 OTT 혜택이나 부가서비스 할인을 알뜰하게 챙깁니다.',
                  'sub2': '2. 신용/체크카드 구독료 할인 혜택', 'desc2': '디지털 구독 서비스에 할인 혜택을 제공하는 가성비 카드 추천입니다.',
                  'sub3': '3. 가족 요금제 및 공식 맴버십 활용', 'desc3': '합법적인 범위 내에서 가족 계정 공유 및 요금 절감 팁을 제시합니다.',
                  'sub4': '4. 연간 결제 할인 프로모션 비교', 'desc4': '월별 결제보다 저렴한 연간 구독 상품의 가격 비교 및 가성비 분석입니다.',
                  'sub5': '5. 안 쓰는 구독 서비스 한눈에 정리', 'desc5': '자신도 모르게 자동 결제되고 있는 숨은 OTT 서비스를 조회하고 해지하는 방법입니다.'
              },
              {
                  'title': '초보자도 10분 만에 끝내는 연말정산 절세 전략 핵심 요약',
                  'sub1': '1. 신용카드 vs 체크카드 vs 현금영수증 비율', 'desc1': '소득공제율이 다른 결제 수단들을 연봉 구간별로 가장 유리하게 조합하는 가이드입니다.',
                  'sub2': '2. 연금저축 및 IRP 세액공제 한도 채우기', 'desc2': '노후 준비와 동시에 연말정산 환급금을 극대화하는 세액공제 계좌 활용법입니다.',
                  'sub3': '3. 월세 세액공제 신청 조건과 서류', 'desc3': '무주택 세대주가 지불한 월세 금액을 돌려받는 필수 서류 정리입니다.',
                  'sub4': '4. 부모님 및 부양가족 인적공제 기준', 'desc4': '소득 요건과 나이 요건을 충족하는 부양가족을 누락 없이 등록하여 공제받는 방법입니다.',
                  'sub5': '5. 홈택스 연말정산 미리보기 서비스 활용', 'desc5': '미리 예상 환급금을 조회해 보고 부족한 공제 항목을 채우는 노하우입니다.'
              }
          ]
          
          item = random.choice(posts_db)
          
          new_post = f'''
          <article class=\"post\">
              <h2>🔥 {item['title']}</h2>
              <p style=\"color: #666; font-size: 0.9em;\">발행일시: {now} | 작성자: 핫트렌드 정보 봇</p>
              <hr style=\"border: 0; height: 1px; background: #eee; margin: 15px 0;\">
              <p>본 포스팅은 많은 이용자들이 실질적으로 자주 검색하는 핫이슈 및 최신 생활·디지털 정보 리포트입니다.</p>
              
              <h3>{item['sub1']}</h3>
              <p>{item['desc1']}</p>
              
              <h3>{item['sub2']}</h3>
              <p>{item['desc2']}</p>
              
              <h3>{item['sub3']}</h3>
              <p>{item['desc3']}</p>

              <h3>{item['sub4']}</h3>
              <p>{item['desc4']}</p>

              <h3>{item['sub5']}</h3>
              <p>{item['desc5']}</p>
              
              <blockquote style=\"background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; margin: 20px 0; border-radius: 4px;\">
                  <b>💡 핵심 요약:</b> 유용한 정보는 유입 트래픽을 지속적으로 높여주는 효자 콘텐츠가 됩니다.
              </blockquote>
          </article>
          '''
          
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          updated_content = content.replace('<div class=\"content\">', '<div class=\"content\">\n' + new_post)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Auto-Bot"
          git config --global user.email "bot@auto.com"
          git add index.html
          git commit -m "Auto: Publish Diverse Hot Trend article" || exit 0
          git push
