name: AI Daily Auto Post Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Auto Post Script
        run: |
          python -c "
          import datetime
          import random

          now = datetime.datetime.now().strftime('%Y-%m-%d')
          
          # 고품질 포스팅 데이터베이스
          posts_db = [
              {
                  'title': '2026년 구글 SEO 최적화 필수 전략 5가지 분석',
                  'sub1': '1. 키워드 의도 분석 및 맞춤 콘텐츠 작성',
                  'desc1': '단순히 키워드를 반복하는 시대는 지났습니다. 검색자가 해당 키워드를 입력한 핵심 목적과 궁금증을 정확히 해소해 주는 깊이 있는 콘텐츠가 상위 노출의 핵심입니다.',
                  'sub2': '2. 모바일 로딩 속도 및 사용자 경험(UX) 개선',
                  'desc2': '구글은 모바일 퍼스트 인덱싱을 기본으로 적용합니다. 불필요한 스크립트를 줄이고 이미지 용량을 최적화하여 2초 이내로 페이지가 로딩되도록 유지해야 합니다.',
                  'sub3': '3. 가독성을 높이는 두괄식 구조와 소제목 활용',
                  'desc3': '방문자가 원하는 정보를 빠르게 찾을 수 있도록 <h2>, <h3> 태그를 활용해 문단을 나눕니다. 결론을 먼저 제시하는 두괄식 구성이 체류 시간을 늘려줍니다.',
                  'sub4': '4. 내부 링크 구조화 및 연관 글 연결',
                  'desc4': '내 사이트 안의 다른 관련 포스팅으로 연결되는 링크를 자연스럽게 삽입하면 구글 크롤러가 사이트 전체의 주제 연관성을 높게 평가하게 됩니다.',
                  'sub5': '5. E-E-A-T(경험, 전문성, 권위성, 신뢰성) 확보',
                  'desc5': '출처가 명확한 정보와 실제 활용 사례를 제시하여 포스팅의 신뢰도를 높여야 구글의 품질 평가 가이드라인을 통과할 수 있습니다.'
              },
              {
                  'title': '초보자를 위한 무료 웹 파이프라인 자동화 구축 가이드',
                  'sub1': '1. 서버 비용 0원으로 시작하는 정적 호스팅 서비스',
                  'desc1': 'GitHub Pages나 Vercel 같은 플랫폼을 활용하면 별도의 월 서버 비용 없이도 안정적이고 빠른 웹사이트를 평생 무료로 운영할 수 있습니다.',
                  'sub2': '2. GitHub Actions를 통한 무인 포스팅 시스템 세팅',
                  'desc2': '클라우드 환경에서 정해진 시간에 스크립트를 자동으로 실행해 주는 CI/CD 도구를 활용하면 매일 손대지 않고도 새로운 콘텐츠를 업데이트할 수 있습니다.',
                  'sub3': '3. Python 기반의 콘텐츠 수집 및 템플릿 처리',
                  'desc3': '파이썬의 간단한 코드 구성을 활용해 템플릿 형태의 데이터 구조를 정의하면, 구글 검색엔진에 잘 노출되는 깔끔한 HTML 게시글을 생성할 수 있습니다.',
                  'sub4': '4. 검색엔진 자동 제출(IndexNow / Search Console)',
                  'desc4': '글이 생성되면 구글과 빙(Bing)에 자동으로 URL 제출 신호를 보내 검색 로봇이 즉시 내 글을 퍼가도록 만드는 시스템을 연동해야 합니다.',
                  'sub5': '5. 구글 애드센스 승인을 위한 고품질 포스팅 유지법',
                  'desc5': '최소 1,000자 이상의 알찬 본문 내용과 명확한 주제 의식을 담은 포스팅을 10개 이상 쌓은 후 신청해야 거절 없이 승인을 받을 수 있습니다.'
              }
          ]
          
          item = random.choice(posts_db)
          
          new_post = f'''
          <article class=\"post\">
              <h2>🚀 {item['title']} ({now})</h2>
              <hr style=\"border: 0; height: 1px; background: #eee; margin: 15px 0;\">
              <p>본 포스팅은 최근 트렌드 정보와 전문적인 가이드를 바탕으로 정밀하게 구성된 자동 발행 리포트입니다.</p>
              
              <h3>{item['sub1']}</h3>
              <p>{item['desc1']}</p>
              
              <h3>{item['sub2']}</h3>
              <p>{item['desc2']}</p>
              
              <h3>{item['sub3']}</h3>
              <p>{item['desc3']}</p>

              <h3>{item['sub4']}</h3>
              <p>{item['desc4']}</p>

              <h3>{item['sub5']}</h3>
              <p>{item['desc5']}</p>
              
              <blockquote style=\"background: #f9f9f9; border-left: 4px solid #007bff; padding: 10px; margin: 20px 0;\">
                  <b>💡 요약:</b> 지속적인 검색 상위 노출과 수익화를 위해서는 주기적인 자동화 포스팅과 더불어 콘텐츠의 가독성 및 깊이를 유지하는 것이 무엇보다 중요합니다.
              </blockquote>
          </article>
          '''
          
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          updated_content = content.replace('<div class=\"content\">', '<div class=\"content\">\n' + new_post)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Auto-Bot"
          git config --global user.email "bot@auto.com"
          git add index.html
          git commit -m "Auto: Publish high quality rich post" || exit 0
          git push
