name: AI Gemini Auto Post Pipeline

on:
  schedule:
    - cron: '0 */8 * * *' # 8시간마다 자동 실행
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google GenAI Library
        run: pip install google-genai

      - name: Run AI Post Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import datetime
          from google import genai

          # 구글 Gemini API 클라이언트 초기화
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')

          # AI에게 내릴 지시사항 (프롬프트)
          prompt = '''
          너는 대중들이 자주 검색하는 핫 트렌드 및 생활/디지털 정보 블로그 에디터야.
          사람들이 검색을 많이 하는 실생활 유용한 주제(예: IT 꿀팁, 스마트폰 기능, 정부 지원금, 가성비 생활 팁, AI 활용법 등) 중 하나를 무작위로 골라서, HTML 형식으로 블로그 포스팅 본문을 작성해줘.
          
          반드시 아래 HTML 구조와 태그를 지켜서 출력해줘 (마크다운 백틱 ```html 나 ``` 없이 순수 HTML 코드만 작성할 것):
          
          <h2>🔥 [주제에 맞는 매력적인 제목]</h2>
          <p style=\"color: #666; font-size: 0.9em;\">발행일시: ''' + now + ''' | 작성자: AI 핫트렌드 봇</p>
          <hr style=\"border: 0; height: 1px; background: #eee; margin: 15px 0;\">
          <p>본 포스팅은 실생활에 유용한 최신 트렌드 및 필수 정보 리포트입니다.</p>
          
          <h3>1. [소제목 1]</h3>
          <p>[상세 내용 1]</p>
          
          <h3>2. [소제목 2]</h3>
          <p>[상세 내용 2]</p>
          
          <h3>3. [소제목 3]</h3>
          <p>[상세 내용 3]</p>

          <h3>4. [소제목 4]</h3>
          <p>[상세 내용 4]</p>
          
          <blockquote style=\"background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; margin: 20px 0; border-radius: 4px;\">
              <b>💡 핵심 요약:</b> [핵심 한 줄 요약]
          </blockquote>
          '''

          # Gemini 모델 호출 (가장 가볍고 빠른 gemini-2.5-flash 사용)
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )
          
          ai_post_html = response.text.strip()
          
          # 래퍼 article 태그로 감싸기
          new_post = f'''
          <article class=\"post\">
          {ai_post_html}
          </article>
          '''

          # index.html 파일에 삽입
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          updated_content = content.replace('<div class=\"content\">', '<div class=\"content\">\n' + new_post)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI-Auto-Bot"
          git config --global user.email "bot@auto.com"
          git add index.html
          git commit -m "AI: Auto-generated unique trending post" || exit 0
          git push
