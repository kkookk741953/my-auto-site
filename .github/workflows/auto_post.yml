name: AI Daily Auto Post Pipeline

on:
  schedule:
    - cron: '0 */8 * * *' # 8시간마다 하루 3번 자동 실행
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Auto Post Script
        run: |
          python -c "
          import datetime
          import random

          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          
          # 사람들이 자주 찾는 핫 트렌드 & 생활/IT 꿀팁 키워드 DB
          posts_db = [
              {
                  'title': '일상 업무 효율을 10배 높여주는 무료 AI 툴 추천 Top 5',
                  'sub1': '1. 자동 문서 요약 및 글쓰기 지원 AI',
                  'desc1': '긴 보고서나 기사를 한눈에 요약해주고, 복잡한 메일 작성을 몇 초 만에 도와주는 AI 툴 활용법을 소개합니다.',
                  'sub2': '2. 고화질 이미지 및 디자인 생성 AI',
                  'desc2': '디자인 지식이 없어도 원하는 설명만 입력하면 PPT 발표 자료나 썸네일을 뚝딱 만들어주는 툴을 활용해 보세요.',
                  'sub3': '3. 음성 파일 텍스트 자동 변환 툴',
                  'desc3': '회의록이나 강의 녹음 파일의 텍스트 변환 및 핵심 요약을 자동으로 처리하여 작업 시간을 획기적으로 줄여줍니다.',
                  'sub4': '4. 엑셀 함수 및 데이터 분석 자동화',
                  'desc4': '어려운 엑셀 수식을 외울 필요 없이, 원하는 결과를 말로 입력하면 자동으로 수식을 생성해 주는 초간단 팁입니다.',
                  'sub5': '5. 나만의 맞춤형 AI 비서 설정 노하우',
                  'desc5': '스마트폰과 PC에서 매일 반복되는 일정 관리와 메모 정리 업무를 자동화하는 가장 쉬운 방법을 안내합니다.'
              },
              {
                  'title': '모르면 손해! 스마트폰 배터리 수명 2배 늘리는 필수 설정법',
                  'sub1': '1. 화면 디스플레이 최적화 설정',
                  'desc1': '다크 모드 활용과 자동 밝기 조절, 주사율 설정을 변경하는 것만으로도 하루 배터리 소모량을 30% 이상 절약할 수 있습니다.',
                  'sub2': '2. 백그라운드 앱 데이터 차단하기',
                  'desc2': '사용하지 않는 앱들이 뒤에서 배터리와 데이터를 계속 소모하지 않도록 절전 상태로 전환하는 세팅법입니다.',
                  'sub3': '3. 올바른 충전 습관과 방전 방지 팁',
                  'desc3': '80% 제한 충전 기능 활용법과 배터리 수명을 크게 갉아먹는 과열 현상을 방지하는 올바른 충전 가이드입니다.',
                  'sub4': '4. 위치 서비스 및 위치 추적 옵션 관리',
                  'desc4': '불필요한 앱들의 위치 권한을 '앱 사용 중에만 허용'으로 변경하여 지속적인 배터리 누수를 차단하세요.',
                  'sub5': '5. 시스템 최적화 및 메모리 정리 자동화',
                  'desc5': '주기적으로 기기를 자동으로 재부팅하고 불필요한 캐시 파일을 정리해 주는 스마트폰 자체 기능을 활성화합니다.'
              },
              {
                  'title': '숨은 정부 지원금 한눈에 조회하고 바로 신청하는 방법',
                  'sub1': '1. 보조금24를 통한 맞춤형 지원금 검색',
                  'desc1': '정부24 플랫폼의 보조금24 서비스를 이용하면 내가 받을 수 있는 중앙부처 및 지자체 혜택을 한 번에 확인 가능합니다.',
                  'sub2': '2. 청년/장년/어르신 연령대별 주요 혜택',
                  'desc2': '청년도약계좌, 내일배움카드, 구직활동지원금 등 각 연령별로 놓치기 쉬운 주요 금융 지원 정책들을 정리해 드립니다.',
                  'sub3': '3. 미환급금 및 휴면예금 찾기 세팅',
                  'desc3': '국민건강보험료 환급금, 통신사 미환급금, 휴면계좌 숨은 돈을 3분 만에 조회하고 계좌로 입금받는 순서입니다.',
                  'sub4': '4. 카드 포인트 현금화 서비스 활용법',
                  'desc4': '소멸되기 쉬운 여러 카드의 포인트를 하나로 모아 즉시 현금으로 계좌 이체하는 방법을 알려드립니다.',
                  'sub5': '5. 신청 시 유의사항 및 필수 제출 서류',
                  'desc5': '지원금 신청 기간과 자격 요건을 미리 확인하고 필요한 증빙 서류를 정부24에서 발급받는 꿀팁을 확인하세요.'
              }
          ]
          
          item = random.choice(posts_db)
          
          new_post = f'''
          <article class=\"post\">
              <h2>🔥 {item['title']}</h2>
              <p style=\"color: #666; font-size: 0.9em;\">발행일시: {now} | 작성자: 핫트렌드 정보 봇</p>
              <hr style=\"border: 0; height: 1px; background: #eee; margin: 15px 0;\">
              <p>본 포스팅은 많은 이용자들이 실질적으로 자주 검색하는 핫이슈 및 최신 생활·디지털 정보 리포트입니다.</p>
              
              <h3>{item['sub1']}</h3>
              <p>{item['desc1']}</p>
              
              <h3>{item['sub2']}</h3>
              <p>{item['desc2']}</p>
              
              <h3>{item['sub3']}</h3>
              <p>{item['desc3']}</p>

              <h3>{item['sub4']}</h3>
              <p>{item['desc4']}</p>

              <h3>{item['sub5']}</h3>
              <p>{item['desc5']}</p>
              
              <blockquote style=\"background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; margin: 20px 0; border-radius: 4px;\">
                  <b>💡 핵심 요약:</b> 유용한 정보는 유입 트래픽을 지속적으로 높여주는 효자 콘텐츠가 됩니다.
              </blockquote>
          </article>
          '''
          
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          updated_content = content.replace('<div class=\"content\">', '<div class=\"content\">\n' + new_post)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Auto-Bot"
          git config --global user.email "bot@auto.com"
          git add index.html
          git commit -m "Auto: Publish Hot Trend & Useful Tips article" || exit 0
          git push
