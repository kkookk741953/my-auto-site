name: AI Gemini Auto Post Pipeline

on:
  schedule:
    - cron: '0 */8 * * *' # 8시간마다 자동 실행
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run AI Post Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import json
          import urllib.request
          import datetime
          import random

          api_key = os.environ.get('GEMINI_API_KEY', '')
          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')

          # 핫 트렌드 및 생활 정보 스마트 콘텐츠 풀 (AI 호출 실패 시 완벽 대체)
          smart_posts_pool = [
              {
                  'title': '스마트폰 배터리 수명 2배 늘리는 실전 설정 꿀팁',
                  'sub1': '1. 디스플레이 및 주사율 최적화', 'desc1': '화면 밝기를 자동으로 맞추고 불필요하게 높은 주사율을 낮추면 전력 소모를 크게 줄일 수 있습니다.',
                  'sub2': '2. 백그라운드 앱 데이터 차단', 'desc2': '쓰지 않는 앱들이 뒤에서 실행되며 배터리를 갉아먹는 현상을 절전 모드로 차단하세요.',
                  'sub3': '3. 올바른 충전 및 발열 관리', 'desc3': '충전 중에는 고사양 게임이나 동영상 시청을 피하고, 80% 제한 기능을 활용하면 수명이 연장됩니다.',
                  'sub4': '4. 위치 서비스 권한 관리', 'desc4': '항상 켜져 있는 위치 추적 권한을 \'앱 사용 중에만 허용\'으로 변경하여 누수를 막습니다.'
              },
              {
                  'title': '숨은 정부 지원금 및 미환급금 3분 만에 찾는 방법',
                  'sub1': '1. 보조금24 맞춤형 조회 서비스', 'desc1': '정부24 포털의 보조금24를 이용하면 내가 받을 수 있는 국가 및 지자체 혜택을 한눈에 확인할 수 있습니다.',
                  'sub2': '2. 건강보험료 및 통신사 미환급금', 'desc2': '과다 납부된 건보료나 해지된 통신사 요금의 숨은 환급금을 본인 인증 한 번으로 조회하고 돌려받으세요.',
                  'sub3': '3. 신용카드 포인트 현금화', 'desc3': '소멸 직전의 카드 포인트를 통합 조회하여 곧바로 내 계좌로 현금 이체할 수 있습니다.',
                  'sub4': '4. 청년 및 가구별 지원 정책 신청', 'desc4': '청년도약계좌, 주거 안정 지원금 등 놓치기 쉬운 금융 정책의 신청 시기를 확인하세요.'
              },
              {
                  'title': 'PC 및 노트북 속도 향상시키는 초간단 용량 정리법',
                  'sub1': '1. 임시 파일 및 시스템 캐시 삭제', 'desc1': '윈도우에 쌓이는 불필요한 임시 캐시 데이터를 원클릭으로 정리하여 드라이브 용량을 확보합니다.',
                  'sub2': '2. 시작 프로그램 및 부팅 최적화', 'desc2': 'PC가 켜질 때 백그라운드에서 저절로 실행되어 속도를 느리게 만드는 앱들을 비활성화합니다.',
                  'sub3': '3. 저장 공간 자동 감지 기능 활용', 'desc3': '윈도우 자체 스토리지 센스 기능을 켜서 방치된 대용량 다운로드 파일을 자동 청소합니다.',
                  'sub4': '4. 불필요한 그리드 프로그램 제거', 'desc4': 'P2P 파일 공유 등으로 인해 인터넷 속도를 저하시키는 백그라운드 유틸리티를 삭제합니다.'
              },
              {
                  'title': '일상 업무 효율을 극대화하는 무료 AI 툴 활용법 Top 4',
                  'sub1': '1. 긴 문서 및 이메일 자동 요약', 'desc1': '복잡한 긴 보고서나 아티클을 몇 초 만에 핵심만 추출하여 요약해 주는 AI 기능을 활용합니다.',
                  'sub2': '2. 프레젠테이션 및 썸네일 기획', 'desc2': '디자인 감각이 없어도 원하는 텍스트 명령만으로 발표 자료 구성을 도와주는 툴입니다.',
                  'sub3': '3. 음성 파일 텍스트 변환 및 회의록', 'desc3': '강의 녹음이나 회의 음성 파일을 순식간에 텍스트 대본으로 변환하고 정리해 줍니다.',
                  'sub4': '4. 반복적인 엑셀 수식 자동 생성', 'desc4': '어려운 엑셀 함수를 일일이 외울 필요 없이 원하는 결과값을 말로 설명하면 수식을 만들어 줍니다.'
              },
              {
                  'title': '비행기표 최저가 예매하는 검색 알고리즘 회피 꿀팁',
                  'sub1': '1. 브라우저 시크릿 모드 활용', 'desc1': '항공권을 검색할 때 쿠키 기록이 남으면 가격이 변동될 수 있으므로 시크릿 창을 이용합니다.',
                  'sub2': '2. 가격 변동이 적은 예매 요일', 'desc2': '통계적으로 항공권 요금이 낮게 책정되는 주중 화요일과 수요일을 공략하세요.',
                  'sub3': '3. 다구간 및 스톱오버 조합', 'desc3': '직항 노선 대신 경유편이나 다구간 예매를 활용하면 비용을 대폭 아낄 수 있습니다.',
                  'sub4': '4. 얼리버드 및 특가 알림 설정', 'desc4': '항공사별 정기 프로모션 스케줄을 미리 파악하고 앱 알림을 설정해 두세요.'
              }
          ]

          ai_post_html = ''
          success_api = False

          # 1순위: Gemini API를 통한 실시간 AI 창작 시도
          try:
              if api_key:
                  # 최신 안정 모델 버전 사용
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}'
                  prompt = '너는 핫 트렌드 정보 에디터야. 실생활 유용한 IT, 금융, 생활 정보 중 하나를 골라 아래 형식의 순수 HTML 본문만 작성해줘 (코드블록 백틱 사용 금지):\n<h2>🔥 [제목]</h2>\n<p>소개글</p>\n<h3>1. 소제목</h3>\n<p>내용</p>\n<h3>2. 소제목</h3>\n<p>내용</p>'
                  data = {'contents': [{'parts': [{'text': prompt}]}]}
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(data).encode('utf-8'),
                      headers={'Content-Type': 'application/json'}
                  )
                  with urllib.request.urlopen(req) as response:
                      res_data = json.loads(response.read().decode('utf-8'))
                      ai_post_html = res_data['candidates'][0]['content']['parts'][0]['text'].strip()
                      success_api = True
          except Exception as e:
              print(f'API 통신 우회 전환: {e}')

          # 2순위: API 실패 시 스마트 풀에서 고품질 트렌드 콘텐츠 자동 추출
          if not success_api:
              item = random.choice(smart_posts_pool)
              ai_post_html = f'''
              <h2>🔥 {item['title']}</h2>
              <p style=\"color: #666; font-size: 0.9em;\">발행일시: {now} | 작성자: 핫트렌드 정보 봇</p>
              <hr style=\"border: 0; height: 1px; background: #eee; margin: 15px 0;\">
              <p>본 포스팅은 실생활에 유용한 최신 트렌드 및 필수 정보 리포트입니다.</p>
              
              <h3>{item['sub1']}</h3>
              <p>{item['desc1']}</p>
              
              <h3>{item['sub2']}</h3>
              <p>{item['desc2']}</p>
              
              <h3>{item['sub3']}</h3>
              <p>{item['desc3']}</p>

              <h3>{item['sub4']}</h3>
              <p>{item['desc4']}</p>
              
              <blockquote style=\"background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; margin: 20px 0; border-radius: 4px;\">
                  <b>💡 핵심 요약:</b> 유용한 정보는 유입 트래픽을 지속적으로 높여주는 효자 콘텐츠가 됩니다.
              </blockquote>
              '''

          new_post = f'''
          <article class=\"post\">
          {ai_post_html}
          </article>
          '''

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          if '<div class=\"content\">' in content:
              updated_content = content.replace('<div class=\"content\">', '<div class=\"content\">\n' + new_post)
          else:
              updated_content = content.replace('</body>', new_post + '\n</body>')

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI-Auto-Bot"
          git config --global user.email "bot@auto.com"
          git add index.html
          git commit -m "Auto: Publish verified trending post" || exit 0
          git push
