name: AI Daily Auto Post Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자동으로 실행
  workflow_dispatch: # 수동 실행 가능

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Auto Post Script
        run: |
          python -c "
          import datetime
          import random

          now = datetime.datetime.now().strftime('%Y-%m-%d')
          
          # 자동 생성할 주제와 본문 템플릿 예시
          topics = [
              ('2026년 최신 AI 자동화 트렌드 분석', '인공지능 기술이 급성장함에 따라 단순 반복 업무를 자동화하는 파이프라인 구축이 필수적이 되고 있습니다. 본 리포트에서는 최신 AI 툴과 효율적인 생산성 향상 방안을 다룹니다.'),
              ('초보자를 위한 디지털 노마드 수익 모델 가이드', '최소한의 노력으로 온라인 수익 파이프라인을 구축하는 다양한 방법이 주목받고 있습니다. 검색엔진 최적화(SEO)와 자동화 웹사이트 운영을 통한 효율적 관리 노하우를 공개합니다.'),
              ('SEO 검색엔진 최적화 필수 전략 5가지', '구글과 네이버 검색 상위 노출을 위해 반드시 알아야 할 키워드 배치, 메타 태그 설정, 고품질 콘텐츠 작성법을 종합 정리해 드립니다.')
          ]
          
          title, description = random.choice(topics)
          
          new_post = f'''
          <div class=\"post\">
              <h2>🚀 {title} ({now})</h2>
              <p><b>[오늘의 핵심 요약]</b> {description}</p>
              <p>최신 트렌드 정보를 매일 자동으로 분석하여 전달해 드리는 AI 자동 포스팅 시스템입니다. 구글 검색엔진 최적화(SEO) 기준에 맞추어 구성된 콘텐츠입니다.</p>
          </div>
          '''
          
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          updated_content = content.replace('<div class=\"content\">', '<div class=\"content\">\n' + new_post)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Auto-Bot"
          git config --global user.email "bot@auto.com"
          git add index.html
          git commit -m "Auto: Add rich AI post" || exit 0
          git push
